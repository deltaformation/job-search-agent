type: project-work
displayName: Project Work
displayNamePlural: Project Work
icon: view_kanban
color: "#2563eb"

modes:
  inline: true
  fullDocument: false

sharing: personal
draftByDefault: false

idPrefix: wrk
idFormat: ulid

fields:
  - name: title
    type: string
    required: true

  - name: status
    type: select
    required: true
    default: backlog
    options:
      - value: backlog
        label: Backlog
        icon: inventory_2
        color: "#64748b"
        category: backlog
      - value: in-progress
        label: In Progress
        icon: motion_photos_on
        color: "#f59e0b"
        category: started
      - value: in-review
        label: In Review
        icon: rate_review
        color: "#3b82f6"
        category: started
      - value: blocked
        label: Blocked
        icon: block
        color: "#dc2626"
        category: started
      - value: done
        label: Done
        icon: check_circle
        color: "#10b981"
        category: done

  - name: kind
    type: select
    required: true
    default: task
    options:
      - value: milestone
        label: Milestone
      - value: task
        label: Task
      - value: decision
        label: Decision
      - value: idea
        label: Idea

  - name: milestone
    type: select
    required: false
    options:
      - value: m1
        label: M1 Discovery
      - value: m2
        label: M2 Resume
      - value: m3
        label: M3 Applications
      - value: m4
        label: M4 Evidence
      - value: m5
        label: M5 Control Bridge
      - value: m6
        label: M6 Morning Radar
      - value: workspace
        label: Workspace
      - value: future
        label: Future

  - name: priority
    type: select
    required: false
    default: medium
    options:
      - value: low
        label: Low
      - value: medium
        label: Medium
      - value: high
        label: High
      - value: critical
        label: Critical

  - name: owner
    type: user

  - name: description
    type: text

  - name: tags
    type: array
    itemType: string

inlineTemplate: "{icon} {title} {status} {kind} {milestone}"

roles:
  title: title
  workflowStatus: status
  priority: priority
  assignee: owner
  tags: tags
