[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "job-system"
version = "0.2.0"
description = "Local-first, MCP-native job-search and application automation system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.3.5",
    "pandas>=2.2.0",
    "python-jobspy>=1.1.80",
    "fastmcp>=4.0.0",
    "mcp>=2.2.0",
    "pydantic>=2.10.0",
    "pyyaml>=6.0.2",
    "pypdf>=6.0.0",
    "jinja2>=3.1.5",
    "beautifulsoup4>=4.13.0",
    "python-dotenv>=1.0.1",
    "requests>=2.32.0",
    "pytz>=2025.1",
    "starlette>=1.6.0",
    "uvicorn>=0.52.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "anyio>=4.8.0",
]
